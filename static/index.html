<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body { font-family: -apple-system, system-ui, sans-serif; color: #f3eefb;
    background: radial-gradient(120% 120% at 50% 0%, #2a1a3a 0%, #15101f 60%, #0c0a12 100%); }

  #app { display: flex; height: 100%; }
  #left  { flex: 0 0 40%; position: relative; min-width: 0; }       /* model 40% */
  #live2d { width: 100%; height: 100%; display: block; }
  #right { flex: 0 0 60%; display: flex; flex-direction: column;    /* chat 60% */
    border-left: 1px solid #ffffff14; background: #0e0b16cc; min-width: 0; }

  header { padding: 16px; text-align: center; font-weight: 700; letter-spacing: .5px; }
  header small { display:block; font-weight: 400; opacity: .55; margin-top: 4px; font-size: 12px; }
  #log { flex: 1; overflow-y: auto; padding: 8px 16px 14px; display: flex; flex-direction: column; gap: 10px; }
  .bubble { max-width: 80%; padding: 11px 15px; border-radius: 16px; line-height: 1.45; font-size: 17px; white-space: pre-wrap; }
  .me  { align-self: flex-end; background: #3b3550; border-bottom-right-radius: 4px; }
  .ai  { align-self: flex-start; background: #6d3a8e; border-bottom-left-radius: 4px; }
  .sys { align-self: center; opacity: .6; font-size: 13px; text-align: center; }
  footer { padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  #status { min-height: 18px; font-size: 13px; opacity: .7; }
  #mic { width: 84px; height: 84px; border-radius: 50%; border: none; cursor: pointer;
    background: #8b46c0; color: #fff; font-size: 32px; transition: transform .08s, background .2s;
    box-shadow: 0 8px 30px rgba(139,70,192,.45); }
  #mic:active { transform: scale(.94); }
  #mic.rec  { background: #e0466b; animation: pulse 1.2s infinite; }
  #mic.busy { background: #d98324; box-shadow: 0 8px 30px rgba(217,131,36,.45); }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(224,70,107,.5); } 50% { box-shadow: 0 0 0 16px rgba(224,70,107,0); } }
  #footlinks { display: flex; gap: 20px; align-items: center; }
  #reset, #sleep { background: none; border: none; color: #b9a9d6; font-size: 13px;
    text-decoration: underline; cursor: pointer; padding: 0; }
  #sleep[hidden], #reset[hidden], #gear[hidden] { display: none; }
  #mic:disabled { opacity: .45; cursor: default; box-shadow: none; }
  #mic.wake { background: #c08a46; box-shadow: 0 8px 30px rgba(192,138,70,.45); }

  /* Cold-start progress. Honest elapsed time against the measured ~89 s, no fake stages. */
  #wake { display: none; width: 100%; max-width: 340px; flex-direction: column;
    align-items: center; gap: 7px; }
  #wake.show { display: flex; }
  #waketext { font-size: 13px; opacity: .75; text-align: center; }
  #wakebar { width: 100%; height: 6px; border-radius: 3px; background: #ffffff1a; overflow: hidden; }
  #wakebar i { display: block; height: 100%; width: 0; background: #8b46c0; transition: width .45s linear; }
  #wakebar.over i { background: #c08a46; }
  /* A stalled turn gets no bar until it is clearly a cold start - there is no honest
     estimate to draw against the ~8.7 s first-turn cost. */
  #wake.plain #wakebar { display: none; }

  @media (max-width: 760px) {
    #app { flex-direction: column; }
    #left { flex: 0 0 40%; }
    #right { flex: 1 1 auto; border-left: none; border-top: 1px solid #ffffff14; }
  }

  header { position: relative; }
  #gear { position: absolute; top: 12px; right: 12px; background: none; border: none;
    color: #cdbbe6; font-size: 22px; cursor: pointer; line-height: 1; }
  #gear:active { transform: scale(.9); }
  #overlay { position: fixed; inset: 0; background: #000000bb; display: none;
    align-items: center; justify-content: center; z-index: 50; padding: 20px; }
  #overlay.show { display: flex; }
  #panel { background: #1b1430; border: 1px solid #ffffff1f; border-radius: 16px;
    max-width: 560px; width: 100%; max-height: 86vh; overflow: auto; padding: 22px; }
  #panel h3 { margin: 0 0 4px; font-size: 19px; }
  #panel .hint { opacity: .6; font-size: 13px; margin-bottom: 14px; }
  .persona-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .persona { text-align: left; padding: 10px 12px; border-radius: 10px; border: 1px solid #ffffff1f;
    background: #2a2140; color: #f3eefb; cursor: pointer; }
  .persona:hover { border-color: #ffffff44; }
  .persona.sel { border-color: #b06cff; background: #3a2a5c; }
  .persona b { display: block; font-size: 15px; text-align: center; padding: 6px 0; }
  .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
  .btn { padding: 9px 18px; border-radius: 10px; border: none; cursor: pointer; font-size: 14px; }
  .btn.primary { background: #8b46c0; color: #fff; }
  .btn.ghost { background: #2a2140; color: #cdbbe6; }
  /* Two short labels fit side by side even on a phone - no single-column fallback needed. */

  #textbar { display: none; width: 100%; gap: 8px; align-items: center; }
  #textinput { flex: 1; min-width: 0; padding: 12px 14px; border-radius: 22px; border: 1px solid #ffffff24;
    background: #1b1430; color: #f3eefb; font-size: 16px; outline: none; }
  #textinput:focus { border-color: #b06cff; }
  #sendbtn { flex: 0 0 auto; width: 46px; height: 46px; border-radius: 50%; border: none; cursor: pointer;
    background: #8b46c0; color: #fff; font-size: 18px; }
  #sendbtn:active { transform: scale(.92); }
  .toggle { display: flex; align-items: center; gap: 10px; margin: 0 0 18px; font-size: 14px; cursor: pointer; }
  .toggle input { width: 18px; height: 18px; accent-color: #8b46c0; }
</style>
</head>
<body>
  <div id="app">
    <div id="left"><canvas id="live2d"></canvas></div>
    <div id="right">
      <header>Zeta <small>tap to talk · tap again to send · tap ⏹ to stop her</small>
        <button id="gear" title="Personality settings">⚙️</button></header>
      <div id="log"></div>
      <footer>
        <div id="status">checking…</div>
        <!-- Shown whenever the container is (or looks like it is) starting: an explicit
             wake, a fresh load onto a scaled-down container, or a turn that stalls. -->
        <div id="wake"><div id="waketext"></div><div id="wakebar"><i></i></div></div>
        <button id="mic" disabled>🎤</button>
        <div id="textbar">
          <input id="textinput" type="text" placeholder="Type a message…" autocomplete="off" />
          <button id="sendbtn" title="Send">➤</button>
        </div>
        <div id="footlinks">
          <button id="reset">clear conversation</button>
          <!-- Cloud only: ends the 15-min billed idle tail now. Unhidden once
               /api/health confirms this is the Modal deployment. -->
          <button id="sleep" hidden title="End the session and stop the billing clock">&#128564; sleep now</button>
        </div>
      </footer>
    </div>
  </div>

  <div id="overlay">
    <div id="panel">
      <label class="toggle"><input type="checkbox" id="textmode"> Text mode — type instead of talk</label>
      <h3>Personality</h3>
      <div class="hint">Pick how she talks, then Save.</div>
      <div class="persona-list" id="plist"></div>
      <div class="row">
        <button class="btn ghost" id="pcancel">Cancel</button>
        <button class="btn primary" id="psave">Save &amp; Apply</button>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/browser/pixi.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/dylanNew/live2d/webgl/Live2D/lib/live2d.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display/dist/cubism2.min.js"></script>
<script>
const logEl = document.getElementById('log');
const micBtn = document.getElementById('mic');
const statusEl = document.getElementById('status');
const resetBtn = document.getElementById('reset');
const sleepBtn = document.getElementById('sleep');
const textbar = document.getElementById('textbar');
const textInput = document.getElementById('textinput');
const sendBtn = document.getElementById('sendbtn');

const wakeEl = document.getElementById('wake');
const wakeText = document.getElementById('waketext');
const wakeBar = document.getElementById('wakebar');
const wakeFill = wakeBar.querySelector('i');

// ---- state: 'idle' | 'recording' | 'busy' | 'waking' | 'asleep' ----
let state = 'idle', controller = null, streamDone = false;
let stream = null, recorder = null, chunks = [];
// The mic stays dead until /api/health has answered. It used to be tappable while the
// container was still starting, so you could talk into a page that had nobody listening.
let ready = false;

// Measured over four cold starts on 2026-09-05 (see MAINTENANCE.md). Only used to draw an
// honest elapsed-vs-expected bar; past it the bar stops and says so rather than animating
// a lie, because the container cannot report its own progress.
const WAKE_ESTIMATE_S = 89;
// A turn that has gone quiet for this long is worth acknowledging. 4 s, not the 3 s used
// for /api/health, because a warm turn's first event lands at 1-2.7 s and 3 s would fire
// on ordinary turns.
const TURN_WAKE_MS = 4000;
// ...but a quiet turn is NOT yet evidence of a cold start, and this is the distinction the
// first version got wrong. The measured first turn after a cold start costs ~8.7 s, so
// showing it "usually ~89 s" was off by an order of magnitude in the one case the wake
// button leads straight into. Until a turn has run past this it says only how long it has
// been waiting; past it, the container really is starting and the ~89 s estimate applies.
const TURN_COLD_MS = 15000;

// ---- playback queue holds {text, b64}; text is revealed when its audio plays ----
const player = new Audio();
let queue = [], playing = false, pendingText = null, pendingMood = null, turnBubble = null;
let audioCtx = null, analyser = null, waveData = null, audioUnlocked = false;
const SILENT = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';

// ---- full body+face pose, one per mood tag (see EMOTION_VOICE in config.py) ----
//
// Tuned by eye against the live model. This drives 14-21 parameters per mood instead of
// the three it used to, using the same vocabulary the model's own artist used in its
// expressions/f02 and f04 files: arms, head angle, gaze direction, blush (PARAM_TERE),
// gloom shading (PARAM_DONYORI) and mouth width. Notably PARAM_MOUTH_SIZE - not
// PARAM_MOUTH_FORM - is what actually produces a smile on this model.
//
// tune/motion_lab.html renders these side by side with the old face-only version.
const EMOTIONS = {
  // head tilted, gaze drifting up and away, one hand raised - visibly working it out
  pondering: { PARAM_ANGLE_X:10, PARAM_ANGLE_Y:6, PARAM_ANGLE_Z:-5,
    PARAM_EYE_BALL_X:0.35, PARAM_EYE_BALL_Y:0.55, PARAM_EYE_L_OPEN:0.85, PARAM_EYE_R_OPEN:0.85,
    PARAM_BROW_L_Y:-0.1, PARAM_BROW_R_Y:-0.1, PARAM_BROW_L_ANGLE:0.2, PARAM_BROW_R_ANGLE:0.2,
    PARAM_BROW_L_FORM:-0.2, PARAM_BROW_R_FORM:-0.2, PARAM_MOUTH_FORM:0, PARAM_MOUTH_SIZE:-0.3,
    PARAM_ARM_L:0.45, PARAM_ARM_R:0.15, PARAM_BODY_Y:-0.1 },
  // leaning in, eyes wide with a sparkle - the one state where she lights up
  curious: { PARAM_ANGLE_X:-6, PARAM_ANGLE_Y:4, PARAM_ANGLE_Z:3,
    PARAM_EYE_BALL_X:0, PARAM_EYE_BALL_Y:0.1, PARAM_EYE_L_OPEN:1.3, PARAM_EYE_R_OPEN:1.3,
    PARAM_EYE_BALL_KIRAKIRA:0.8, PARAM_BROW_L_Y:0.3, PARAM_BROW_R_Y:0.3,
    PARAM_BROW_L_FORM:0.4, PARAM_BROW_R_FORM:0.4, PARAM_MOUTH_FORM:0.4, PARAM_MOUTH_SIZE:0.5,
    PARAM_ARM_L:0.6, PARAM_ARM_R:0.6, PARAM_BODY_Y:0.2, PARAM_BODY_Z:-4 },
  // half-lidded side glance and a smirk - dry, not laughing
  amused: { PARAM_ANGLE_X:4, PARAM_ANGLE_Z:6,
    PARAM_EYE_BALL_X:0.35, PARAM_EYE_BALL_Y:-0.1, PARAM_EYE_L_OPEN:0.7, PARAM_EYE_R_OPEN:0.7,
    PARAM_EYE_FORM:0.4, PARAM_BROW_L_ANGLE:-0.3, PARAM_BROW_R_ANGLE:-0.3,
    PARAM_BROW_L_FORM:0.3, PARAM_BROW_R_FORM:0.3, PARAM_MOUTH_FORM:0.9, PARAM_MOUTH_SIZE:0.2,
    PARAM_ARM_L:-0.5, PARAM_ARM_R:-0.5 },
  // hands up defensively, blushing, looking away - inferior Fe getting poked
  flustered: { PARAM_ANGLE_X:13, PARAM_ANGLE_Z:7,
    PARAM_EYE_BALL_X:-0.5, PARAM_EYE_BALL_Y:-0.45, PARAM_EYE_L_OPEN:1.1, PARAM_EYE_R_OPEN:1.1,
    PARAM_BROW_L_Y:-0.3, PARAM_BROW_R_Y:-0.3, PARAM_BROW_L_ANGLE:0.4, PARAM_BROW_R_ANGLE:0.4,
    PARAM_BROW_L_FORM:-0.5, PARAM_BROW_R_FORM:-0.5, PARAM_MOUTH_FORM:-0.2, PARAM_MOUTH_SIZE:-0.3,
    PARAM_TERE:1, PARAM_ARM_L:1, PARAM_ARM_R:1, PARAM_BODY_Y:-0.2 },
  // turned away, gaze down, gloom shading, slumped - the "aloof" read

    PARAM_EYE_BALL_X:-0.4, PARAM_EYE_BALL_Y:-0.7, PARAM_EYE_L_OPEN:0.7, PARAM_EYE_R_OPEN:0.7,

    PARAM_BROW_L_X:-0.3, PARAM_BROW_R_X:-0.3, PARAM_BROW_L_ANGLE:0.5, PARAM_BROW_R_ANGLE:0.5,

    PARAM_ARM_L:-1, PARAM_ARM_R:-1, PARAM_BODY_Y:-0.5 },
  // still, upright, actually looking at you - rare on purpose
  earnest: { PARAM_ANGLE_X:0, PARAM_ANGLE_Y:0, PARAM_ANGLE_Z:0,
    PARAM_EYE_BALL_X:0, PARAM_EYE_BALL_Y:0, PARAM_EYE_L_OPEN:0.95, PARAM_EYE_R_OPEN:0.95,
    PARAM_BROW_L_Y:-0.1, PARAM_BROW_R_Y:-0.1, PARAM_BROW_L_FORM:-0.3, PARAM_BROW_R_FORM:-0.3,
    PARAM_MOUTH_FORM:0.3, PARAM_MOUTH_SIZE:0, PARAM_TERE:0.25,
    PARAM_ARM_L:0, PARAM_ARM_R:0, PARAM_BODY_Y:0 },

  // --- the cheerful persona's three. See PERSONA_MOODS in config.py.
  // open and warm, looking right at you
  happy: { PARAM_ANGLE_X:-3, PARAM_ANGLE_Z:4,
    PARAM_EYE_BALL_X:0, PARAM_EYE_BALL_Y:0.1, PARAM_EYE_L_OPEN:1.0, PARAM_EYE_R_OPEN:1.0,
    PARAM_BROW_L_Y:0.35, PARAM_BROW_R_Y:0.35, PARAM_BROW_L_FORM:0.5, PARAM_BROW_R_FORM:0.5,
    PARAM_MOUTH_FORM:1.0, PARAM_MOUTH_SIZE:0.7, PARAM_TERE:0.35,
    PARAM_ARM_L:0.3, PARAM_ARM_R:0.3, PARAM_BODY_Y:0.15 },
  // full genki - the one place ZetaLoud and the eye sparkles both go to maximum
  excited: { PARAM_ANGLE_X:-8, PARAM_ANGLE_Z:-6,
    PARAM_EYE_BALL_X:0, PARAM_EYE_BALL_Y:0.3, PARAM_EYE_L_OPEN:1.45, PARAM_EYE_R_OPEN:1.45,
    PARAM_EYE_BALL_KIRAKIRA:1, PARAM_BROW_L_Y:0.6, PARAM_BROW_R_Y:0.6,
    PARAM_BROW_L_FORM:0.7, PARAM_BROW_R_FORM:0.7, PARAM_MOUTH_FORM:1.0, PARAM_MOUTH_SIZE:1.0,
    PARAM_TERE:0.5, PARAM_ARM_L:1, PARAM_ARM_R:1, PARAM_BODY_Y:0.4, PARAM_BODY_Z:-6 },
  // mock-sulking: cheeks up, brows down, looking away - not actual anger
  pouty: { PARAM_ANGLE_X:9, PARAM_ANGLE_Z:-7,
    PARAM_EYE_BALL_X:0.45, PARAM_EYE_BALL_Y:-0.25, PARAM_EYE_L_OPEN:0.65, PARAM_EYE_R_OPEN:0.65,
    PARAM_BROW_L_Y:-0.45, PARAM_BROW_R_Y:-0.45, PARAM_BROW_L_ANGLE:-0.5, PARAM_BROW_R_ANGLE:-0.5,
    PARAM_BROW_L_FORM:-0.3, PARAM_BROW_R_FORM:-0.3, PARAM_MOUTH_FORM:-0.8, PARAM_MOUTH_SIZE:-0.6,
    PARAM_TERE:0.6, PARAM_ARM_L:-0.6, PARAM_ARM_R:-0.6, PARAM_BODY_Y:-0.15 },
};
const DEFAULT_MOOD = 'pondering';

// Posture parameters are BLENDED with whatever the idle motion is doing rather than
// overwritten, so she keeps breathing and drifting instead of freezing into a mannequin.
// Face parameters aren't listed here, so those we own outright (weight 1).
const BLEND = {
  PARAM_ANGLE_X: 0.7, PARAM_ANGLE_Y: 0.7, PARAM_ANGLE_Z: 0.7,
  PARAM_ARM_L: 0.85, PARAM_ARM_R: 0.85,
  PARAM_BODY_X: 0.6, PARAM_BODY_Y: 0.7, PARAM_BODY_Z: 0.6,
};

// Union of every parameter any mood touches. A parameter a mood doesn't mention eases
// back to 0 rather than sticking at the previous mood's value.
const POSE_KEYS = [...new Set(Object.values(EMOTIONS).flatMap(Object.keys))];

// Arms travel much further than an eyebrow, so the easing is gentler than the old 0.12.
const EASE = 0.085;

let emoCur = {};
POSE_KEYS.forEach(k => emoCur[k] = 0);
let emoTgt = EMOTIONS[DEFAULT_MOOD];
function setEmotion(name) { emoTgt = EMOTIONS[name] || EMOTIONS[DEFAULT_MOOD]; }

function setStatus(s) { statusEl.textContent = s; }
function setState(s) {
  state = s;
  micBtn.className = (s === 'recording') ? 'rec' : (s === 'busy') ? 'busy'
                   : (s === 'asleep') ? 'wake' : '';
  micBtn.textContent = (s === 'idle') ? '🎤' : (s === 'asleep') ? '☀️'
                     : (s === 'waking') ? '⏳' : '⏹';
  micBtn.title = (s === 'asleep') ? 'Wake her up' : '';
  if (sendBtn) sendBtn.textContent = (s === 'busy') ? '⏹' : '➤';   // send doubles as stop while busy
  applyMode();
  applyEnabled();
  applyFooter();
}

// Set from /api/health: only the Modal deployment has anything to put to sleep.
let cloud = false;
/** While she is asleep or waking, every control that calls the API is hidden.
 *
 *  On a sleeping container ANY request is a cold start, so these used to cost ~89 s of A10
 *  to do nothing useful: 😴 woke her just to put her back to sleep, ⚙️ hung for a minute and
 *  a half, and "clear conversation" (pointless anyway - history dies with the container)
 *  also reset the page to a greyed-out 🎤 with the ☀️ button gone, stranding the user until
 *  a reload. The one control left is the wake button itself.
 *
 *  gear is looked up here rather than through its const, which is declared further down -
 *  touching it from here before that line runs would throw and take the whole script out. */
function isDormant() { return state === 'asleep' || state === 'waking'; }
function applyFooter() {
  const dormant = isDormant();
  sleepBtn.hidden = !cloud || dormant;
  resetBtn.hidden = dormant;
  document.getElementById('gear').hidden = dormant;
}
// Asleep the mic IS the wake button, so it stays live; waking, nothing is tappable.
function applyEnabled() {
  const on = (state === 'asleep') ? true : (state === 'waking') ? false : ready;
  micBtn.disabled = !on;
  if (sendBtn) sendBtn.disabled = !on;
  if (textInput) textInput.disabled = !on;
}

// ---- cold-start progress ----
let wakeTimer = null, wakeT0 = 0;
/** kind: 'cold' - health is not answering, so the container really is starting (~89 s).
 *        'turn' - a turn went quiet, which is usually just the first-turn cost. Says
 *                 nothing about how long it will take until it has run past TURN_COLD_MS
 *                 and has therefore turned out to be a cold start after all. */
function showWaking(kind, since) {
  if (wakeTimer) return;
  // Count from when the wait actually began, not from when this display appeared. The
  // display only shows up once a wait is already slow (4 s into a turn, 3 s into a page
  // load), so starting the clock here under-reported every wait by that much - and made
  // the switch to the ~89 s bar land at 19 s instead of TURN_COLD_MS.
  wakeT0 = since || Date.now();
  wakeEl.classList.add('show');
  const tick = () => {
    const ms = Date.now() - wakeT0;
    const s = Math.floor(ms / 1000);
    const clock = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
    const plain = (kind === 'turn' && ms < TURN_COLD_MS);
    wakeEl.classList.toggle('plain', plain);
    if (plain) {
      // No bar, no estimate - just how long it has actually been.
      wakeText.textContent = 'she is taking a moment… ' + clock;
      return;
    }
    if (s <= WAKE_ESTIMATE_S) {
      wakeText.textContent = 'waking her up… ' + clock + ' / usually ~' + WAKE_ESTIMATE_S + ' s';
      wakeFill.style.width = (100 * s / WAKE_ESTIMATE_S) + '%';
      wakeBar.classList.remove('over');
    } else {
      wakeText.textContent = 'still waking… ' + clock + ' — longer than usual';
      wakeFill.style.width = '100%';
      wakeBar.classList.add('over');
    }
  };
  tick();
  wakeTimer = setInterval(tick, 500);
}
function hideWaking() {
  if (wakeTimer) { clearInterval(wakeTimer); wakeTimer = null; }
  wakeEl.classList.remove('show', 'plain');
  wakeBar.classList.remove('over');
  wakeFill.style.width = '0';
}
function addBubble(text, cls) {
  const d = document.createElement('div');
  d.className = 'bubble ' + cls; d.textContent = text;
  logEl.appendChild(d); logEl.scrollTop = logEl.scrollHeight; return d;
}
function revealText(t) {
  if (!t) return;
  if (!turnBubble) turnBubble = addBubble(t, 'ai');
  else { turnBubble.textContent += ' ' + t; }
  logEl.scrollTop = logEl.scrollHeight;
}

// ---- queue: pair each sentence's text + mood with its audio, reveal on play ----
// The mood rides along in the queue rather than being applied when the event arrives:
// audio lags the stream by however long TTS took, so switching the face on arrival
// would change her expression before the matching sentence is spoken.
function enqueue(text, b64, mood) { queue.push({ text, b64, mood }); pump(); }
function pump() {
  if (playing) return;
  if (queue.length) {
    const item = queue.shift();
    if (item.mood) setEmotion(item.mood);  // face changes as this sentence starts
    revealText(item.text);                 // text appears together with its voice
    if (item.b64) {
      playing = true; setStatus('speaking…');
      player.src = 'data:audio/wav;base64,' + item.b64;
      player.play().catch(() => { playing = false; pump(); });
    } else { pump(); }                      // sentence had no audio -> continue
    return;
  }
  if (state === 'busy') setStatus(streamDone ? 'ready' : 'thinking…');
  if (streamDone && state === 'busy') { setState('idle'); setEmotion(DEFAULT_MOOD); }
}
player.onended = () => { playing = false; pump(); };
player.onerror = () => { playing = false; pump(); };
function stopAudio() { try { player.pause(); } catch (e) {} player.removeAttribute('src'); queue = []; playing = false; pendingText = null; pendingMood = null; }

function unlockAudio() {
  if (!audioCtx) {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const src = audioCtx.createMediaElementSource(player);
      analyser = audioCtx.createAnalyser(); analyser.fftSize = 512;
      waveData = new Uint8Array(analyser.fftSize);
      src.connect(analyser); analyser.connect(audioCtx.destination);
    } catch (e) {}
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  if (audioUnlocked) return;
  player.src = SILENT;
  player.play().then(() => { audioUnlocked = true; }).catch(() => {});
}
function currentMouth() {
  if (!analyser || player.paused || !player.src) return 0;
  analyser.getByteTimeDomainData(waveData);
  let sum = 0;
  for (let i = 0; i < waveData.length; i++) { const x = (waveData[i] - 128) / 128; sum += x * x; }
  return Math.min(1, Math.sqrt(sum / waveData.length) * 3.2);
}

// ---- Live2D (Shizuku) ----
const MODEL_URL = "https://cdn.jsdelivr.net/gh/guansss/pixi-live2d-display@master/test/assets/shizuku/shizuku.model.json";
(async function initLive2D() {
  try {
    const left = document.getElementById('left');
    const app = new PIXI.Application({ view: document.getElementById('live2d'),
      resizeTo: left, backgroundAlpha: 0, antialias: true });
    const model = await PIXI.live2d.Live2DModel.from(MODEL_URL);
    app.stage.addChild(model);
    model.autoInteract = false;              // <- look straight ahead, don't follow the cursor
    model.anchor.set(0.5, 0.5);
    const fit = () => {
      const s = Math.min(app.renderer.width / model.internalModel.width,
                         app.renderer.height / model.internalModel.height) * 0.92;
      model.scale.set(s);
      model.position.set(app.renderer.width / 2, app.renderer.height / 2);
    };
    fit();
    window.addEventListener('resize', () => setTimeout(fit, 50));
    model.internalModel.on('afterMotionUpdate', () => {
      const cm = model.internalModel.coreModel;
      try {
        // Grab the blink BEFORE the loop overwrites it - once we've written our own value
        // the motion's is gone, so reading it back afterwards would just return our own.
        const blinkL = cm.getParamFloat('PARAM_EYE_L_OPEN');
        const blinkR = cm.getParamFloat('PARAM_EYE_R_OPEN');

        for (const k of POSE_KEYS) {
          const want = (k in emoTgt) ? emoTgt[k] : 0;
          emoCur[k] += (want - emoCur[k]) * EASE;
          const w = BLEND[k];
          if (w === undefined) {
            cm.setParamFloat(k, emoCur[k]);          // face: ours outright
          } else {
            // posture: mix our pose with whatever the idle motion just set
            cm.setParamFloat(k, cm.getParamFloat(k) * (1 - w) + emoCur[k] * w);
          }
        }
        // Eyes are in the pose table, but blinking is the model's own motion. Whenever it
        // blinks (drives the eyes below our target) let the blink win, so she still blinks
        // in every mood instead of staring through the whole conversation.
        if (blinkL < emoCur.PARAM_EYE_L_OPEN) cm.setParamFloat('PARAM_EYE_L_OPEN', blinkL);
        if (blinkR < emoCur.PARAM_EYE_R_OPEN) cm.setParamFloat('PARAM_EYE_R_OPEN', blinkR);
        cm.setParamFloat('PARAM_MOUTH_OPEN_Y', currentMouth());   // lip-sync always wins
      } catch (e) {}
    });
  } catch (e) {
    addBubble('Live2D failed to load: ' + e.message, 'sys');
  }
})();

// ---- mic ----
async function ensureMic() {
  if (stream) return true;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    addBubble('Microphone needs HTTPS. Open this page over https:// (see MAINTENANCE.md, Local mode).', 'sys'); return false;
  }
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); return true; }
  catch (e) { addBubble('Mic permission denied: ' + e.message, 'sys'); return false; }
}
async function startRec() {
  unlockAudio();
  if (!(await ensureMic())) return;
  chunks = [];
  recorder = new MediaRecorder(stream);
  recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  recorder.onstop = sendAudio;
  recorder.start();
  setState('recording'); setStatus('listening…');
}
function stopRec() { if (recorder && recorder.state !== 'inactive') recorder.stop(); }
function cancelTurn() { if (controller) { try { controller.abort(); } catch (e) {} } disarmSlowTurn(); stopAudio(); setState('idle'); setStatus('ready'); }

// A turn against a scaled-down container blocks until the cold start finishes. Show the
// same progress display rather than leaving "thinking…" up for a minute and a half.
let slowTurnTimer = null;
function armSlowTurn() {
  disarmSlowTurn();
  const sentAt = Date.now();
  slowTurnTimer = setTimeout(() => { slowTurnTimer = null; showWaking('turn', sentAt); }, TURN_WAKE_MS);
}
function disarmSlowTurn() {
  if (slowTurnTimer) { clearTimeout(slowTurnTimer); slowTurnTimer = null; }
  hideWaking();
}

async function consumeStream(r) {
  const reader = r.body.getReader(); const dec = new TextDecoder(); let buf = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let nl;
    while ((nl = buf.indexOf('\n')) >= 0) {
      const line = buf.slice(0, nl); buf = buf.slice(nl + 1);
      if (!line.trim()) continue;
      disarmSlowTurn();   // something came back, so she is not asleep after all
      // The host can inject plain-text errors into the stream instead of our NDJSON
      // (e.g. Modal emits "modal-http: workspace ... is disabled"). Surface those as
      // they are rather than dying on a confusing JSON parse error.
      let msg;
      try { msg = JSON.parse(line); }
      catch (e) { addBubble('Server: ' + line.trim(), 'sys'); continue; }
      if (msg.type === 'user') { addBubble(msg.text, 'me'); setStatus('thinking…'); }
      else if (msg.type === 'text') {
        if (pendingText !== null) enqueue(pendingText, null, pendingMood);  // previous sentence had no audio
        pendingText = msg.text; pendingMood = msg.mood;
      }
      else if (msg.type === 'audio') { enqueue(pendingText || '', msg.b64, pendingMood); pendingText = null; }
      else if (msg.type === 'error') addBubble('(' + msg.text + ')', 'sys');
    }
  }
  if (pendingText !== null) { enqueue(pendingText, null, pendingMood); pendingText = null; }
  streamDone = true; pump();
}

async function sendAudio() {
  const blob = new Blob(chunks, { type: recorder.mimeType || 'audio/mp4' });
  if (!blob.size) { setState('idle'); setStatus('ready'); return; }
  setState('busy'); setStatus('transcribing…');
  streamDone = false; pendingText = null; pendingMood = null; turnBubble = null;
  controller = new AbortController();
  try {
    const fd = new FormData(); fd.append('audio', blob, 'speech');
    armSlowTurn();
    const r = await fetch('/api/talk', { method: 'POST', body: fd, signal: controller.signal });
    await consumeStream(r);
  } catch (e) {
    streamDone = true;
    if (e.name !== 'AbortError') addBubble('Network error: ' + e.message, 'sys');
  } finally {
    disarmSlowTurn();
    controller = null;
    if (state === 'busy' && !playing && !queue.length) { setState('idle'); setStatus('ready'); }
  }
}

async function sendText() {
  const t = textInput.value.trim();
  if (!t || state === 'busy') return;
  unlockAudio();                       // user gesture -> allow TTS playback + lip-sync
  textInput.value = '';
  addBubble(t, 'me');                  // text mode: show what we typed ourselves
  setState('busy'); setStatus('thinking…');
  streamDone = false; pendingText = null; pendingMood = null; turnBubble = null;
  controller = new AbortController();
  try {
    armSlowTurn();
    const r = await fetch('/api/say', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: t }), signal: controller.signal });
    await consumeStream(r);
  } catch (e) {
    streamDone = true;
    if (e.name !== 'AbortError') addBubble('Network error: ' + e.message, 'sys');
  } finally {
    disarmSlowTurn();
    controller = null;
    if (state === 'busy' && !playing && !queue.length) { setState('idle'); setStatus('ready'); }
  }
}

micBtn.addEventListener('click', () => {
  if (state === 'asleep') wakeHer();
  else if (state === 'idle') startRec();
  else if (state === 'recording') stopRec();
  else if (state === 'busy') cancelTurn();
});

// ---- text mode (toggle in Settings; persists across refresh) ----
// localStorage THROWS rather than returning null where storage is blocked — Safari private
// browsing, and any data:/sandboxed context. Unguarded, that exception kills the rest of
// this script, taking the health check and the sleep button with it, so both accessors are
// wrapped and the preference simply doesn't persist there.
function prefGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function prefSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

let textMode = prefGet('zeta_textmode') === '1';
function applyMode() {
  // While asleep or waking the mic button is the wake button / spinner, so it is shown
  // even in text mode - there is nothing to type at yet.
  const typing = textMode && state !== 'asleep' && state !== 'waking';
  micBtn.style.display = typing ? 'none' : '';
  textbar.style.display = typing ? 'flex' : 'none';
}
applyMode();
applyEnabled();
sendBtn.addEventListener('click', () => { if (state === 'busy') cancelTurn(); else sendText(); });
textInput.addEventListener('keydown', e => { if (e.key === 'Enter' && state !== 'busy') sendText(); });
resetBtn.addEventListener('click', async () => {
  if (isDormant()) return;          // hidden then anyway - see applyFooter()
  cancelTurn();
  await fetch('/api/reset', { method: 'POST' });
  logEl.innerHTML = ''; turnBubble = null; addBubble('conversation cleared', 'sys'); setStatus('ready');
});

// ---- personality settings ----
const gear = document.getElementById('gear');
const overlay = document.getElementById('overlay');
const plist = document.getElementById('plist');
const psave = document.getElementById('psave');
const pcancel = document.getElementById('pcancel');
// The panel offers the presets by name only - no prompt text, no editor. The text still
// comes from /api/personas and is sent back on save, so the server side is unchanged.
let pickedId = null;   // preset id chosen in this panel session, sent with the save
let presetText = {};   // id -> persona text, as served

function markSelected() {
  [...plist.children].forEach(c => c.classList.toggle('sel', c.dataset.id === pickedId));
}
async function openSettings() {
  if (isDormant()) return;
  try {
    const d = await (await fetch('/api/personas')).json();
    plist.innerHTML = '';
    (d.presets || []).forEach(p => {
      const b = document.createElement('button');
      b.className = 'persona'; b.dataset.id = p.id;
      const bold = document.createElement('b'); bold.textContent = p.label;
      b.appendChild(bold);
      presetText[p.id] = p.text;
      b.onclick = () => { pickedId = p.id; markSelected(); };
      plist.appendChild(b);
    });
    pickedId = d.current_id || null;
    markSelected();
    document.getElementById('textmode').checked = textMode;
    overlay.classList.add('show');
  } catch (e) { addBubble('Could not load settings: ' + e.message, 'sys'); }
}
gear.addEventListener('click', openSettings);
document.getElementById('textmode').addEventListener('change', e => {
  textMode = e.target.checked;
  prefSet('zeta_textmode', textMode ? '1' : '0');
  applyMode();
});
pcancel.addEventListener('click', () => overlay.classList.remove('show'));
overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.remove('show'); });
psave.addEventListener('click', async () => {
  if (!pickedId || !presetText[pickedId]) { overlay.classList.remove('show'); return; }
  try {
    // The id tells the server which mood set to use; the text is the preset's own.
    await fetch('/api/persona', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: presetText[pickedId], id: pickedId }) });
    overlay.classList.remove('show');
    addBubble('personality updated ✨', 'sys');
  } catch (e) { addBubble('Save failed: ' + e.message, 'sys'); }
});

// ---- sleep now (cloud only) ----
// Modal bills container wall-clock, so the 15-minute idle window after a session is about
// half the monthly bill. This ends the session when you say it ends; the cost is that the
// next message pays a cold start instead of landing on a warm container.
sleepBtn.addEventListener('click', async () => {
  if (isDormant()) return;
  if (!confirm('Put Zeta to sleep now?\n\nThis stops the billing clock. Your next message will take about 90 seconds to wake her.')) return;
  cancelTurn();
  try {
    const r = await fetch('/api/sleep', { method: 'POST' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    addBubble('sleeping \u{1F634} \u2014 tap \u2600\uFE0F to wake her (~' + (d.cold_start_s || WAKE_ESTIMATE_S) + ' s)', 'sys');
    // The mic becomes a wake button, so the next tap is a deliberate "start her up"
    // instead of a message shouted at a container that is not there.
    ready = false;
    setState('asleep'); setStatus('asleep');
  } catch (e) { addBubble('Sleep failed: ' + e.message, 'sys'); }
});

// ---- health, and the waking-up experience ----
//
// A dead voice server used to be invisible from the browser: text arrived, no audio, the
// mouth never moved, and you had to read the container logs to find out why. On top of
// that, a scaled-down container answers nothing for ~89 s while it starts, and the page
// used to sit on "ready" through all of it with a tappable mic.
//
// So: ask /api/health before enabling anything, show honest progress if the answer does
// not come straight back, and report the flags it returns when it does.

/** One health request. Returns the parsed body, {__status} if the server answered but
 *  refused (401), or null on a timeout/network error - which means "still waking". */
async function healthOnce(ms) {
  const ac = new AbortController();
  const t = setTimeout(() => ac.abort(), ms);
  try {
    const r = await fetch('/api/health', { signal: ac.signal, cache: 'no-store' });
    if (!r.ok) return { __status: r.status };
    return await r.json();
  } catch (e) {
    return null;
  } finally { clearTimeout(t); }
}

/** Poll health until the container answers, showing the progress display once it is
 *  clearly not instant. A per-attempt timeout is treated as still waking, not an error. */
async function waitForHealth(showAfterMs) {
  const askedAt = Date.now();
  const slow = setTimeout(() => showWaking('cold', askedAt), showAfterMs);
  const deadline = Date.now() + 300000;
  try {
    while (Date.now() < deadline) {
      const h = await healthOnce(20000);
      if (h) return h;
      await new Promise(r => setTimeout(r, 1000));
    }
    return null;
  } finally { clearTimeout(slow); hideWaking(); }
}

function reportHealth(h, verbose) {
  cloud = !!h.cloud;
  applyFooter();
  let bad = false;
  if (!h.ollama) { addBubble('\u26A0\uFE0F the brain is not answering \u2014 replies will fail', 'sys'); bad = true; }
  else if (!h.llm_warm) { addBubble('\u26A0\uFE0F the model did not preload \u2014 the first reply may be slow', 'sys'); bad = true; }
  if (!h.sbv2) { addBubble('\u26A0\uFE0F the voice server is not answering \u2014 you will get text, but no audio', 'sys'); bad = true; }
  else if (!h.tts_warm) { addBubble('\u26A0\uFE0F the voice did not warm up \u2014 the first sentence will be slow', 'sys'); bad = true; }
  // Only narrate a clean bill of health when the user was made to wait for it; on an
  // ordinary warm load silence is the right amount of noise.
  if (!bad && verbose) addBubble('awake \u2014 brain \u2713 voice \u2713 warm \u2713', 'sys');
}

/** Explicit wake: the tap after \uD83D\uDE34, or after she scaled down on her own. */
async function wakeHer() {
  setState('waking'); setStatus('waking\u2026');
  showWaking('cold');
  const h = await waitForHealth(0);
  if (!h) {
    setState('asleep'); setStatus('asleep');
    addBubble('she did not come up within 5 minutes \u2014 tap \u2600\uFE0F to try again', 'sys');
    return;
  }
  if (!h.__status) reportHealth(h, true);
  ready = true; setState('idle'); setStatus('ready');
}

(async function boot() {
  ready = false; setState('idle'); setStatus('checking\u2026');
  const t0 = Date.now();
  // 3 s, because the page you are looking at was served by the container being checked -
  // a warm one answers in milliseconds, and anything slower means it is still starting.
  const h = await waitForHealth(3000);
  const waited = Date.now() - t0 > 3000;
  // Unreachable or 401: not fatal, exactly as before - let the first real turn report it
  // rather than locking the user out of a page that might be perfectly fine.
  if (h && !h.__status) reportHealth(h, waited);
  ready = true; setState('idle'); setStatus('ready');
})();
</script>
